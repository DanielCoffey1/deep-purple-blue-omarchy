# ────────────────────────────────────────────────────────────
# Deep Blue & Purple Theme for Hyprland
# Made with Omarchist
# ────────────────────────────────────────────────────────────

general {
    col.active_border = rgb(b794f6) rgb(7b68ee) 45deg
    col.inactive_border = rgb(2d1b69)
    border_size = 2
    gaps_in = 5
    gaps_out = 8
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        noise = 0.0117
        contrast = 1.0
        brightness = 1.0
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(0d0a1aee)
        color_inactive = rgba(0d0a1a88)
    }
}

group {
    col.border_active = rgb(b794f6) rgb(7b68ee) 45deg
    col.border_inactive = rgb(2d1b69)

    groupbar {
        font_size = 11
        gradients = true
        col.active = rgb(b794f6)
        col.inactive = rgb(4a3973)
    }
}

misc {
    background_color = rgb(0d0a1a)
}
