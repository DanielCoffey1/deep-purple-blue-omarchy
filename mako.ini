# ────────────────────────────────────────────────────────────
# Deep Blue & Purple Theme for Mako
# Made with Omarchist
# ────────────────────────────────────────────────────────────

text-color=#e0d4ff
border-color=#b794f6
background-color=#1a0f2e
width=420
height=110
padding=10
border-size=2
border-radius=10
font=Liberation Sans 11
anchor=top-right
outer-margin=20
default-timeout=5000
max-icon-size=32

[urgency=high]
border-color=#ff6b9d
background-color=#2d1b69

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false
